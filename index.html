<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Төрсөн өдрийн сюрприз</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
/* Layout: one rounded card centred on a soft pink wash; the runaway number tile is the single bold moment. */
:root {
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg-a: #fbe2ec;
  --bg-b: #efe3fa;
  --card: #fff8fb;
  --edge: #f1cfdc;
  --ink: #a8416d;
  --ink-soft: #9c5b79;
  --pill: #f9dce6;
  --dash: #e6a8c0;
  --tile-a: #ee91b0;
  --tile-b: #d55e88;
  --tile-edge: #bd4c76;
  --tile-ink: #ffffff;
  --shadow: rgba(190, 80, 120, .18);
  --field: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-a: #2a1430; --bg-b: #1a1030; --card: #2b1a31; --edge: #4d2c50;
    --ink: #ff9cc0; --ink-soft: #dcaac3; --pill: #432441; --dash: #7c4468;
    --tile-a: #e97fa4; --tile-b: #c94e7b; --tile-edge: #9f3a62;
    --shadow: rgba(0, 0, 0, .4); --field: #231327;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-a: #2a1430; --bg-b: #1a1030; --card: #2b1a31; --edge: #4d2c50;
  --ink: #ff9cc0; --ink-soft: #dcaac3; --pill: #432441; --dash: #7c4468;
  --tile-a: #e97fa4; --tile-b: #c94e7b; --tile-edge: #9f3a62;
  --shadow: rgba(0, 0, 0, .4); --field: #231327;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink-soft);
  background-color: var(--bg-a);
  background-image: linear-gradient(160deg, var(--bg-a), var(--bg-b));
  background-attachment: fixed;
  padding-block: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 18px;
}
button, input { font: inherit; }

.card {
  width: 100%; max-width: 440px;
  background: var(--card);
  border: 1.5px solid var(--edge);
  border-radius: 40px;
  padding: 28px 20px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  text-align: center;
  box-shadow: 0 24px 60px -28px var(--shadow);
}
.tag {
  margin: 0; padding: 12px 20px; border-radius: 999px;
  background: var(--pill); color: var(--ink);
  font-weight: 800; font-size: 13px; letter-spacing: .2em; text-transform: uppercase;
}
.cake { font-size: 68px; line-height: 1; filter: drop-shadow(0 10px 14px var(--shadow)); }
h1 {
  margin: 0; color: var(--ink);
  font-size: clamp(30px, 9vw, 42px); line-height: 1.12; font-weight: 800; letter-spacing: -.02em;
  text-wrap: balance; overflow-wrap: anywhere;
}
.sub { margin: 0; font-size: 18px; line-height: 1.7; max-width: 30ch; text-wrap: balance; }

.game {
  width: 100%; border: 2px dashed var(--dash); border-radius: 30px;
  padding: 20px 14px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.label { margin: 0; color: var(--ink); font-weight: 800; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; text-wrap: balance; }
.arena { position: relative; width: 100%; height: 210px; touch-action: manipulation; }
.tile {
  position: absolute; left: 50%; top: 50%;
  width: 124px; height: 124px; transform: translate(-50%, -50%);
  border: 0; border-radius: 32px; cursor: pointer; padding: 0;
  background: linear-gradient(145deg, var(--tile-a), var(--tile-b));
  color: var(--tile-ink); font-weight: 800; font-size: 70px; letter-spacing: -.04em;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 9px 0 var(--tile-edge), 0 22px 30px -8px var(--shadow);
  transition: left .38s cubic-bezier(.3, 1.5, .5, 1), top .38s cubic-bezier(.3, 1.5, .5, 1), transform .2s;
  -webkit-tap-highlight-color: transparent;
}
.tile:active { transform: translate(-50%, -46%); }
.tile:focus-visible, .pill:focus-visible, .mini:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.tile.won { animation: pop .6s ease; }
@keyframes pop { 0% { transform: translate(-50%, -50%) scale(1); } 40% { transform: translate(-50%, -50%) scale(1.18) rotate(-4deg); } 100% { transform: translate(-50%, -50%) scale(1); } }
.caption { margin: 0; min-height: 1.6em; font-size: 16px; line-height: 1.5; text-wrap: balance; }

.reveal { width: 100%; padding: 4px 6px 0; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.reveal h2 { margin: 0; color: var(--ink); font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
.reveal p { margin: 0; font-size: 17px; line-height: 1.7; max-width: 34ch; text-wrap: pretty; }

.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.pill {
  border: 0; cursor: pointer; border-radius: 999px; padding: 16px 24px;
  background: var(--pill); color: var(--ink); font-weight: 800; font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
.pill[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.foot { margin: 6px 0 0; font-size: 15px; letter-spacing: .02em; }

.maker {
  width: 100%; max-width: 440px; border: 1.5px solid var(--edge); border-radius: 24px;
  background: var(--card); color: var(--ink-soft); padding: 4px 18px;
}
.maker summary { cursor: pointer; padding: 14px 0; font-weight: 800; color: var(--ink); font-size: 15px; }
.maker .body { display: flex; flex-direction: column; gap: 12px; padding-bottom: 18px; }
.maker p { margin: 0; font-size: 14px; line-height: 1.6; }
.fields { display: grid; grid-template-columns: 1fr 96px; gap: 10px; }
.fields label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); min-width: 0; }
.fields input, .code {
  width: 100%; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--edge);
  background: var(--field); color: var(--ink); font-size: 16px; font-weight: 600;
}
.copyrow { display: flex; gap: 8px; align-items: stretch; }
.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; font-weight: 400; }
.mini { border: 0; cursor: pointer; border-radius: 14px; padding: 0 16px; background: var(--ink); color: var(--card); font-weight: 800; font-size: 14px; white-space: nowrap; }

.fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.bit { position: absolute; font-size: 22px; will-change: transform, opacity; }
.heart { bottom: -30px; animation: rise var(--t, 2.6s) ease-out forwards; }
@keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-85vh) translateX(var(--sway, 0px)) scale(1.1); opacity: 0; } }
.conf { width: 10px; height: 14px; border-radius: 3px; animation: burst 1.3s cubic-bezier(.15, .7, .3, 1) forwards; }
@keyframes burst { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .tile { transition: none; }
  .tile.won { animation: none; }
  .heart { animation: fade 1.6s ease-out forwards; bottom: 40%; }
  .conf { animation: fade 1s ease-out forwards; }
  @keyframes fade { 0% { opacity: 1; } 100% { opacity: 0; } }
}
</style>

<main class="card">
  <p class="tag">A little surprise for you ✨</p>
  <div class="cake" aria-hidden="true">🎂</div>
  <h1 id="title">Төрсөн өдрийн мэнд, Энэрэл! 💗</h1>
  <p class="sub">Чамд зориулсан жижигхэн surprise байна. Гэхдээ эхлээд нэг юм барьж авах хэрэгтэй… 👀</p>

  <section class="game" aria-label="Тоо барих тоглоом">
    <p class="label">Чи хэдэн нас хүрч байгаа вэ?</p>
    <div class="arena" id="arena">
      <button class="tile" id="tile" type="button" aria-label="Нас бичсэн тоо. Барьж үз"><span id="age">22</span></button>
    </div>
    <p class="caption" id="caption" aria-live="polite"></p>
  </section>

  <section class="reveal" id="reveal" hidden>
    <div style="font-size:56px;line-height:1" aria-hidden="true">💋</div>
    <h2>Чи барьчихлаа! 🎉</h2>
    <p id="wish"></p>
    <button class="mini" id="again" type="button" style="padding:12px 18px">Дахин тогло</button>
  </section>

  <div class="row">
    <button class="pill" id="music" type="button" aria-pressed="false">🎵 Зөөлөн аялгуу</button>
    <button class="pill" id="hearts" type="button">💗 Зүрхнүүд</button>
  </div>
  <p class="foot">made with love, just for you ♡</p>
</main>

<div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  var NEED = 4;
  var state = { name: "Энэрэл", age: 22 };
  var dodges = 0, won = false, countTimer = null;
  var $ = function (id) { return document.getElementById(id); };
  var tile = $("tile"), arena = $("arena"), caption = $("caption"), fx = $("fx");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  var dodgeLines = [
    "Алдлаа 😝", "Дахиад оролд!", "Бараг л барьчихлаа 👀", "Ойртлоо… ойртлоо…"
  ];

  function resetGame() {
    clearInterval(countTimer);
    dodges = 0; won = false;
    tile.style.left = "50%"; tile.style.top = "50%";
    tile.classList.remove("won");
    $("age").textContent = state.age;
    $("reveal").hidden = true;
    caption.textContent = state.age + " дээр дараарай… чадвал шүү 😝";
  }

  function render() {
    $("title").textContent = "Төрсөн өдрийн мэнд, " + state.name + "! 💗";
    $("wish").textContent = "Миний surprise үнсэлт байлаа 😘 Төрсөн өдрийн мэнд, " + state.name + "! Хүссэн бүхэн чинь биелж, өдөр бүр инээмсэглэлтэй байх болтугай 💗";
    resetGame();
  }

  function dodge() {
    var w = arena.clientWidth, h = arena.clientHeight, half = 66;
    var cx = parseFloat(tile.style.left) || w / 2;
    if (String(tile.style.left).indexOf("%") > -1) cx = w / 2;
    var cy = String(tile.style.top).indexOf("%") > -1 ? h / 2 : parseFloat(tile.style.top);
    var nx, ny, tries = 0;
    do {
      nx = half + Math.random() * Math.max(1, w - 2 * half);
      ny = half + Math.random() * Math.max(1, h - 2 * half);
      tries++;
    } while (Math.hypot(nx - cx, ny - cy) < 90 && tries < 12);
    tile.style.left = nx + "px"; tile.style.top = ny + "px";
    caption.textContent = dodgeLines[Math.min(dodges, dodgeLines.length - 1)];
    dodges++;
    if (dodges >= NEED) caption.textContent = "Ядарчихлаа… одоо дарж болно 😮‍💨";
  }

  function confetti() {
    var r = tile.getBoundingClientRect();
    var colors = ["#ee91b0", "#f7c3d5", "#d55e88", "#c9a7ef", "#ffd6a5", "#ffffff"];
    var n = reduce ? 14 : 44;
    for (var i = 0; i < n; i++) {
      var s = document.createElement("span");
      s.className = "bit conf";
      s.style.left = (r.left + r.width / 2) + "px";
      s.style.top = (r.top + r.height / 2) + "px";
      s.style.background = colors[i % colors.length];
      var a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 190;
      s.style.setProperty("--dx", Math.cos(a) * d + "px");
      s.style.setProperty("--dy", Math.sin(a) * d + 120 + "px");
      s.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      fx.appendChild(s);
      setTimeout(function (el) { return function () { el.remove(); }; }(s), 1500);
    }
  }

  function win() {
    won = true;
    tile.style.left = "50%"; tile.style.top = "50%";
    tile.classList.add("won");
    caption.textContent = "";
    var n = 1, step = Math.max(1, Math.ceil(state.age / 22));
    $("age").textContent = n;
    countTimer = setInterval(function () {
      n = Math.min(state.age, n + step);
      $("age").textContent = n;
      if (n >= state.age) clearInterval(countTimer);
    }, 55);
    $("reveal").hidden = false;
    confetti();
    hearts(10);
  }

  function act() {
    if (won) { confetti(); return; }
    if (dodges < NEED) dodge(); else win();
  }

  tile.addEventListener("pointerdown", function (e) { e.preventDefault(); act(); });
  tile.addEventListener("pointerenter", function (e) {
    if (e.pointerType === "mouse" && !won && dodges < NEED) dodge();
  });
  tile.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); }
  });
  $("again").addEventListener("click", resetGame);

  function hearts(count) {
    var emoji = ["💋", "💗", "😘", "💖", "💕"];
    for (var i = 0; i < count; i++) {
      var s = document.createElement("span");
      s.className = "bit heart";
      s.textContent = emoji[i % emoji.length];
      s.style.left = (6 + Math.random() * 88) + "%";
      s.style.fontSize = (20 + Math.random() * 22) + "px";
      s.style.animationDelay = (reduce ? 0 : Math.random() * .7) + "s";
      s.style.setProperty("--t", (2.2 + Math.random() * 1.4) + "s");
      s.style.setProperty("--sway", (Math.random() * 80 - 40) + "px");
      fx.appendChild(s);
      setTimeout(function (el) { return function () { el.remove(); }; }(s), 4200);
    }
  }
  $("hearts").addEventListener("click", function () { hearts(18); });

  /* soft music: random pentatonic notes over a low pad, started from the button */
  var ctx = null, timer = null, beat = 0;
  var scale = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33];
  function tone(freq, dur, vol, type) {
    var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function tick() {
    if (beat % 8 === 0) { tone(130.81, 3.2, 0.05, "triangle"); tone(196.0, 3.2, 0.035, "triangle"); }
    if (Math.random() > 0.2) tone(scale[Math.floor(Math.random() * scale.length)], 1.6, 0.07, "sine");
    beat++;
  }
  $("music").addEventListener("click", function () {
    var btn = this;
    if (timer) {
      clearInterval(timer); timer = null;
      btn.setAttribute("aria-pressed", "false"); btn.textContent = "🎵 Зөөлөн аялгуу";
      return;
    }
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      beat = 0; tick(); timer = setInterval(tick, 650);
      btn.setAttribute("aria-pressed", "true"); btn.textContent = "⏸ Зогсоох";
    } catch (e) { btn.textContent = "Дуу тоглохгүй байна"; }
  });

  render();
})();
</script>

</body></html>
